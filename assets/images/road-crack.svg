<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Asphalt pavement with a longitudinal (D00) crack</title>
  <defs>
    <!-- NOTE: color-interpolation-filters="sRGB" everywhere - the linearRGB
         default washes turbulence out into flat grey paper texture. -->

    <!-- fine aggregate speckle -->
    <filter id="grit" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="5" seed="11" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g">
        <feFuncR type="linear" slope="2.1" intercept="-0.52" />
        <feFuncG type="linear" slope="2.1" intercept="-0.52" />
        <feFuncB type="linear" slope="2.1" intercept="-0.52" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
    </filter>

    <!-- larger stones in the mix -->
    <filter id="stones" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="4" seed="29" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g">
        <feFuncR type="linear" slope="1.7" intercept="-0.36" />
        <feFuncG type="linear" slope="1.7" intercept="-0.36" />
        <feFuncB type="linear" slope="1.7" intercept="-0.36" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
    </filter>

    <!-- broad tonal drift, keeps the surface from looking tiled -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="41" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" />
    </filter>

    <filter id="crackBlur" x="-25%" y="-10%" width="150%" height="120%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <linearGradient id="falloff" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#9aa0a8" stop-opacity="0.10" />
      <stop offset="0.4" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="wheelPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.045" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="paintFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e3d9" stop-opacity="0.55" />
      <stop offset="0.45" stop-color="#f0ede3" stop-opacity="0.88" />
      <stop offset="1" stop-color="#e6e3d9" stop-opacity="0.62" />
    </linearGradient>

    <!-- the crack geometry, reused for shadow / core / lip -->
    <path id="crackMain"
      d="M296 -10 L303 34 L294 72 L308 112 L299 150 L313 192 L304 230 L319 272
         L310 310 L325 352 L317 390 L332 430 L323 466 L337 510" />
    <path id="crackBranchA" d="M308 112 L288 132 L281 158 L286 178" />
    <path id="crackBranchB" d="M319 272 L342 288 L350 312 L345 332" />
    <path id="crackBranchC" d="M325 352 L303 368 L295 392" />
    <path id="crackBranchD" d="M332 430 L354 446 L360 466" />

    <clipPath id="paintClip">
      <rect x="700" y="0" width="26" height="500" />
    </clipPath>
  </defs>

  <!-- ── pavement ── -->
  <rect width="800" height="500" fill="#343538" />
  <rect width="800" height="500" filter="url(#mottle)" opacity="0.22" />
  <rect width="800" height="500" filter="url(#stones)" opacity="0.28" />
  <rect width="800" height="500" filter="url(#grit)" opacity="0.28" />

  <!-- polished wheel paths -->
  <rect x="80" y="0" width="240" height="500" fill="url(#wheelPath)" />
  <rect x="465" y="0" width="255" height="500" fill="url(#wheelPath)" />

  <!-- old tar seal repairs -->
  <g fill="none" stroke="#1a1b1e" stroke-linecap="round">
    <path d="M596 -10 C610 90 588 190 604 300 C616 380 598 450 610 510"
      stroke-width="10" opacity="0.42" />
    <path d="M108 520 C94 430 120 350 104 260 C92 190 112 120 100 -10"
      stroke-width="7" opacity="0.3" />
  </g>

  <!-- ── worn lane marking ── -->
  <g clip-path="url(#paintClip)">
    <rect x="700" y="0" width="26" height="500" fill="url(#paintFade)" />
    <!-- scuffed away in patches so it doesn't read as a clean bar -->
    <g fill="#343538" opacity="0.55">
      <path d="M700 54 l11 4 -3 22 -8 -3z" />
      <path d="M726 148 l-13 6 2 30 11 -5z" />
      <path d="M700 244 l8 5 -2 16 -6 -3z" />
      <path d="M726 296 l-14 8 3 20 11 -6z" />
      <path d="M700 400 l12 6 -4 27 -8 -4z" />
      <path d="M726 448 l-9 5 1 24 8 -4z" />
    </g>
    <rect x="700" y="0" width="26" height="500" filter="url(#grit)" opacity="0.22" />
  </g>

  <!-- ── D00 longitudinal crack ── -->
  <!-- 1. shadow pooling in the channel -->
  <g filter="url(#crackBlur)" fill="none" stroke="#08090b" stroke-linecap="round"
    stroke-linejoin="round">
    <use href="#crackMain" stroke-width="12" opacity="0.7" />
    <use href="#crackBranchA" stroke-width="6" opacity="0.55" />
    <use href="#crackBranchB" stroke-width="6" opacity="0.55" />
    <use href="#crackBranchC" stroke-width="5" opacity="0.5" />
    <use href="#crackBranchD" stroke-width="5" opacity="0.5" />
  </g>

  <!-- 2. lit lip on the near shoulder -->
  <g transform="translate(-1.6,-0.8)" fill="none" stroke="#92969c" stroke-linecap="round"
    stroke-linejoin="round" opacity="0.22">
    <use href="#crackMain" stroke-width="1.3" />
    <use href="#crackBranchB" stroke-width="0.9" />
  </g>

  <!-- 3. crack core -->
  <g fill="none" stroke="#0b0c0e" stroke-linecap="round" stroke-linejoin="round">
    <use href="#crackMain" stroke-width="5" />
    <use href="#crackBranchA" stroke-width="2.4" />
    <use href="#crackBranchB" stroke-width="2.4" />
    <use href="#crackBranchC" stroke-width="1.9" />
    <use href="#crackBranchD" stroke-width="1.9" />
  </g>

  <!-- 4. spalling: crumbled asphalt hugging the break -->
  <g fill="#0d0e10" opacity="0.7">
    <path d="M299 58 l7 3 -1 7 -6 4 -3 -7z" />
    <path d="M306 146 l-7 4 0 7 6 3 3 -8z" />
    <path d="M317 216 l8 3 -1 8 -7 2 -2 -7z" />
    <path d="M311 314 l-8 3 1 8 7 2 2 -8z" />
    <path d="M328 374 l7 4 -2 7 -6 2 -2 -8z" />
    <path d="M324 450 l-7 4 1 7 6 2 2 -8z" />
  </g>
  <!-- exposed aggregate at the edges -->
  <g fill="#8b8e93" opacity="0.22">
    <circle cx="291" cy="94" r="1.8" />
    <circle cx="323" cy="203" r="1.5" />
    <circle cx="308" cy="299" r="2" />
    <circle cx="337" cy="407" r="1.7" />
    <circle cx="300" cy="379" r="1.4" />
    <circle cx="286" cy="150" r="1.5" />
  </g>

  <!-- ── lighting falloff, last so it unifies everything ── -->
  <rect width="800" height="500" fill="url(#falloff)" />
</svg>
